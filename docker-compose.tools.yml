name: ed-cage-tools

services:
  opa:
    image: ${OPA_IMAGE:-openpolicyagent/opa:latest}
    working_dir: /workspace
    volumes:
      - .:/workspace
    command:
      - version

  kube-linter:
    image: ${KUBE_LINTER_IMAGE:-stackrox/kube-linter:v0.8.3-alpine}
    working_dir: /workspace
    volumes:
      - .:/workspace
    command:
      - lint
      - --help

  trivy:
    image: ${TRIVY_IMAGE:-aquasec/trivy:latest}
    working_dir: /workspace
    volumes:
      - .:/workspace
      - trivy-cache:/root/.cache/trivy
    environment:
      TRIVY_CACHE_DIR: /root/.cache/trivy
    command:
      - --version

volumes:
  trivy-cache: