[project]
name = "ed-cage"
version = "0.1.0"
description = "ED-CAGE: Event-Driven Continuous Architecture Governance Engine"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "ED-CAGE Team" }
]
dependencies = [
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "typer>=0.12.0",
  "rich>=13.7.0",
  "PyYAML>=6.0.1",
  "httpx>=0.27.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.5.0",
  "mypy>=1.10.0"
]

[project.scripts]
ed-cage = "ed_cage.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true