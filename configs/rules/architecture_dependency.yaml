rules:
  - id: ARCH-001
    title: Architecture decision evidence should be discoverable
    category: architecture
    severity: medium
    target: repository
    check_type: repository_architecture_evidence_discovery
    params:
      evidence_type: architecture_decision
      required: false
      include_paths:
        - .
      exclude_paths:
        - .git
        - node_modules
        - target
        - build
        - dist
        - .venv
      file_patterns:
        - "*.md"
        - "*.adoc"
        - "*.rst"
        - "*.txt"
        - "*.yaml"
        - "*.yml"
      candidate_paths:
        - docs/adr
        - docs/adrs
        - adr
        - adrs
        - docs/architecture
        - docs/architecture/decisions
        - architecture/decisions
        - docs/design
        - docs/decisions
        - decision-records
        - design-decisions
      filename_indicators:
        - adr
        - architecture-decision
        - architecture-decision-record
        - decision-record
        - design-decision
      content_markers:
        - status
        - context
        - decision
        - consequences
        - rationale
        - alternatives
      min_marker_count: 3

  - id: ARCH-002
    title: Quality-attribute scenario evidence should be discoverable
    category: architecture
    severity: medium
    target: repository
    check_type: repository_architecture_evidence_discovery
    params:
      evidence_type: quality_scenario
      required: false
      include_paths:
        - .
      exclude_paths:
        - .git
        - node_modules
        - target
        - build
        - dist
        - .venv
      file_patterns:
        - "*.md"
        - "*.adoc"
        - "*.rst"
        - "*.txt"
        - "*.yaml"
        - "*.yml"
        - "*.json"
      candidate_paths:
        - docs/quality-attributes
        - docs/quality
        - docs/scenarios
        - docs/architecture
        - docs/requirements
        - docs/nfr
        - requirements
        - architecture
        - design
      filename_indicators:
        - scenario
        - quality-attribute
        - quality_attributes
        - nfr
        - non-functional
        - nonfunctional
      scenario_markers:
        - stimulus
        - source
        - environment
        - artifact
        - response
        - response measure
        - quality attribute scenario
      quality_attribute_markers:
        - availability
        - modifiability
        - performance
        - security
        - reliability
        - scalability
        - maintainability
      min_scenario_marker_count: 3

  - id: ARCH-003
    title: Critical services must be declared
    description: Critical services should be explicitly declared for risk-based architecture governance.
    category: architecture
    severity: high
    target: architecture-catalog
    check_type: architecture_catalog_policy
    enabled: true
    params:
      policy: require_critical_services
      architecture_catalog_path: configs/architecture/service-architecture.yaml

  - id: DEPEN-001
    title: Service dependencies must be explicitly declared
    description: Each service should explicitly declare its dependencies, even when the dependency list is empty.
    category: dependency
    severity: high
    target: architecture-catalog
    check_type: architecture_catalog_policy
    enabled: true
    params:
      policy: require_declared_dependencies
      architecture_catalog_path: configs/architecture/service-architecture.yaml

  - id: DEPEN-002
    title: Circular service dependencies must not exist
    description: Service dependency graph should not contain circular dependencies.
    category: dependency
    severity: critical
    target: architecture-catalog
    check_type: architecture_catalog_policy
    enabled: true
    params:
      policy: disallow_circular_dependencies
      architecture_catalog_path: configs/architecture/service-architecture.yaml

  - id: DEPEN-003
    title: External dependencies must define owner and SLA metadata
    description: External dependencies should define owner and SLA metadata for operational and contractual governance.
    category: dependency
    severity: high
    target: architecture-catalog
    check_type: architecture_catalog_policy
    enabled: true
    params:
      policy: require_external_dependency_metadata
      architecture_catalog_path: configs/architecture/service-architecture.yaml
      required_metadata:
        - owner
        - sla