project_name: booking-microservices-runtime
repository_path: case-studies/booking-microservices

rules_path: configs/rules
services_path: configs/cases/service-catalogs/booking-microservices-services.yaml
actions_path: configs/actions.yaml
scenarios_path: configs/scenarios/case-studies

output_path: outputs/case-studies/booking-microservices/runtime
evidence_registry_path: outputs/case-studies/booking-microservices/runtime/evidence/evidence-registry.jsonl
architecture_catalog_path: configs/cases/architecture-catalogs/booking-microservices-service-architecture.yaml

execution_mode: runtime

governance_gate:
  minimum_score: 70
  fail_on_error: false
  fail_on_critical: false
  fail_on_high: false
  fail_on_medium: false
  fail_on_any_failure: false

metadata:
  case_study: booking-microservices
  execution_mode: runtime
  case_focus: runtime-service-health-openapi-observability
  technology_profile: aspnetcore-openapi-opentelemetry
  runtime_launcher: repository-native-aspire-apphost
  evaluated_services: identity-flight-passenger-booking
  excluded_component: api-gateway-no-independent-business-api-contract

# All current HTTP/OpenAPI/metrics rules are intentionally enabled. The four
# catalogued business services expose the same evidence profile when started
# in the repository's Development/Aspire profile.
disabled_rule_ids: []

scoring:
  status_scores:
    passed: 1.0
    failed: 0.0
    error: 0.0

  category_weights:
    service: 1.2
    api: 1.1
    observability: 1.3
    uncategorized: 1.0

  maturity_bands:
    - name: Initial Governance
      min_score: 0.0
      max_score: 39.99
    - name: Emerging Governance
      min_score: 40.0
      max_score: 59.99
    - name: Managed Governance
      min_score: 60.0
      max_score: 74.99
    - name: Governed Architecture
      min_score: 75.0
      max_score: 89.99
    - name: Continuously Governed Architecture
      min_score: 90.0
      max_score: 100.0
