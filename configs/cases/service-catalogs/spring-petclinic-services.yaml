services:
  - name: api-gateway
    base_url: http://127.0.0.1:8080
    health_endpoints:
      - /actuator/health
    openapi_paths:
      - /v3/api-docs
      - /openapi.json
    metrics_paths:
      - /actuator/prometheus
      - /metrics
    tags:
      - spring
      - gateway
      - petclinic
    metadata:
      owner: architecture-team
      criticality: high

  - name: customers-service
    base_url: http://127.0.0.1:8081
