services:
  - name: ts-travel-service
    base_url: http://127.0.0.1:12346
    health_endpoints:
      - /actuator/health
      - /health
    openapi_paths:
      - /v2/api-docs
      - /v3/api-docs
      - /swagger.json
      - /openapi.json
    metrics_paths:
      - /actuator/prometheus
      - /actuator/metrics
      - /metrics
    tags:
      - train-ticket
      - domain-service
      - travel
    metadata:
      owner: travel-team
      criticality: high

  - name: ts-order-service
    base_url: http://127.0.0.1:12031
    health_endpoints:
      - /actuator/health
      - /health
    openapi_paths:
      - /v2/api-docs
      - /v3/api-docs
      - /swagger.json
      - /openapi.json
    metrics_paths:
      - /actuator/prometheus
      - /actuator/metrics
      - /metrics
    tags:
      - train-ticket
      - domain-service
      - order
    metadata:
      owner: order-team
      criticality: high