services:
  - name: frontend
    base_url: http://127.0.0.1:8080
    health_endpoints:
      - /_healthz
      - /health
    openapi_paths:
      - /openapi.json
      - /swagger.json
    metrics_paths:
      - /metrics
    tags:
      - boutique
      - frontend
      - critical
    metadata:
      owner: frontend-team
      criticality: high